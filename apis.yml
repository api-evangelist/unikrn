aid: unikrn
name: Unikrn
description: >-
  Unikrn was an esports betting and entertainment company founded in November
  2014 by Rahul Sood and Karl Flores, headquartered in Seattle and backed by
  investors including Mark Cuban, Ashton Kutcher, 500 Global, and Pantera
  Capital. The platform offered real-money and token-based wagering on
  competitive video game tournaments (CS:GO, League of Legends, Dota 2, and
  more) and ran a $30M ICO for its UnikoinGold (UKG) cryptocurrency in 2017,
  which it later disabled as part of a 2021 SEC settlement. Unikrn was acquired
  by Entain in August 2021, and the unikrn.com betting site was permanently
  closed on October 20, 2023. The domain now serves only a farewell notice;
  the company publishes no APIs, developer portal, or public technical
  artifacts.
